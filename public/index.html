<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diremar Casual</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Container Toast Notification (Otomatis dibuat via JS jika belum ada) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- SECTION: HERO & BANNER SLIDER -->
    <section class="relative bg-gray-900 text-white">
        <div class="w-full relative overflow-hidden h-64 sm:h-96">
            <!-- Banner Slider Wrapper -->
            <div id="bannerSlider" class="flex transition-transform duration-500 ease-out w-full h-full">
                <!-- Slide banner akan dirender melalui JavaScript -->
            </div>

            <!-- Slider Dots Indikator -->
            <div id="sliderDots" class="absolute bottom-4 left-0 right-0 flex justify-center gap-2 z-10"></div>
        </div>
    </section>

    <!-- SECTION: MAIN CONTENT & PRODUCTS -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-gray-900">Katalog Produk</h1>
                <span id="productCount" class="text-xs sm:text-sm text-gray-500 font-medium">Memuat produk...</span>
            </div>
            <!-- Search Input -->
            <div class="w-full sm:w-72">
                <input type="text" id="searchInput" placeholder="Cari sneakers..." class="w-full px-4 py-2 text-xs sm:text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-900">
            </div>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
            <!-- Produk akan dirender lewat JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-gray-500 text-sm">Tidak ada produk yang ditemukan.</p>
        </div>
    </main>

    <!-- MODAL DETAIL PRODUK -->
    <div id="productModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 hidden transition-opacity duration-300">
        <div id="modalContent" class="bg-white rounded-2xl max-w-lg w-full mx-4 overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 relative max-h-[90vh] flex flex-col">
            <!-- Tombol Close Modal -->
            <button onclick="closeModal()" class="absolute top-3 right-3 z-10 bg-black/50 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center transition cursor-pointer">✕</button>
            
            <div class="relative w-full h-64 sm:h-80 bg-gray-100">
                <img id="modalImage" src="logo01.webp" alt="Detail Produk" class="w-full h-full object-cover">
                <span id="modalCondition" class="absolute top-3 left-3 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider bg-gray-900 text-white shadow">New</span>
            </div>

            <div class="p-5 sm:p-6 overflow-y-auto flex-grow flex flex-col gap-4">
                <div>
                    <span id="modalSku" class="text-xs font-semibold text-gray-400">SKU: -</span>
                    <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-gray-900 mt-1">-</h2>
                </div>

                <div class="flex items-baseline gap-3">
                    <span id="modalPrice" class="text-lg sm:text-xl font-extrabold text-emerald-600">-</span>
                    <span id="modalOldPrice" class="text-xs sm:text-sm text-gray-400 line-through"></span>
                    <span id="modalDiscountBadge" class="hidden text-[10px] font-bold bg-rose-100 text-rose-600 px-2 py-0.5 rounded-md"></span>
                </div>

                <!-- Galeri Thumbnail Gambar Tambahan -->
                <div id="modalGallery" class="flex gap-2 overflow-x-auto pb-2 hidden"></div>

                <div>
                    <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Pilih Ukuran (Size):</h4>
                    <div id="modalSizeContainer" class="flex flex-wrap gap-2"></div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Deskripsi:</h4>
                    <p id="modalDesc" class="text-xs sm:text-sm text-gray-600 leading-relaxed">-</p>
                </div>

                <!-- Tombol Aksi WhatsApp -->
                <div class="pt-2">
                    <a id="modalWaBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/10 text-xs sm:text-sm">
                        <span id="modalWaBtnText">Pesan Sekarang via WhatsApp</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const API_BASE = "https://round-surf-5635.trbmaster.workers.dev/api";
        let allProducts = [];
        let currentSlideIndex = 0;
        let activeBanners = [];
        let slideInterval;
        let selectedSize = '';
        let currentImages = [];

        // Fungsi Toast Notification / Popup untuk Operasi Berhasil/Gagal
        function showNotification(message, type = 'success') {
            let toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.id = 'toastContainer';
                toastContainer.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none';
                document.body.appendChild(toastContainer);
            }

            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white';
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 transform translate-y-5 opacity-0 transition-all duration-300 pointer-events-auto`;
            
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : '❌'}</span>
                <span>${message}</span>
            `;

            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-5', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-5', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fungsi untuk mengubah status aktif/nonaktif banner dari panel admin
        async function toggleBannerStatus(bannerId, currentStatus) {
            const newStatus = (currentStatus === 'active' || currentStatus === true || currentStatus === 1) ? 'inactive' : 'active';
            
            try {
                const response = await fetch(`${API_BASE}/banners/${bannerId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) throw new Error("Gagal memperbarui status banner di server");

                showNotification(`Status banner berhasil diubah menjadi ${newStatus === 'active' ? 'Aktif' : 'Nonaktif'}`, "success");
                
                // Muat ulang daftar banner
                fetchBanners();
            } catch (error) {
                console.error("Error updating banner status:", error);
                showNotification("Gagal mengubah status banner!", "error");
            }
        }

        async function fetchBanners() {
            try {
                const response = await fetch(`${API_BASE}/banners`);
                if (!response.ok) throw new Error("Gagal mengambil banner");
                const data = await response.json();
                
                const rawBanners = Array.isArray(data) ? data : (data.banners || data.data || []);
                
                // Banner HANYA aktif jika status bernilai 'active', true, atau 1
                activeBanners = rawBanners.filter(b => {
                    const status = String(b.status || '').trim().toLowerCase();
                    return status === 'active' || b.status === true || b.status === 1;
                });
            } catch (error) {
                console.error("Gagal memuat banner dari server:", error);
                activeBanners = [];
            }

            renderBanners();
        }

        function renderBanners() {
            const slider = document.getElementById('bannerSlider');
            const dotsContainer = document.getElementById('sliderDots');
            const bannerSection = slider ? slider.closest('section') : null;
            const parentHeroContainer = slider ? slider.closest('.bg-hero-pattern > div') : null;
            
            if (!slider) return;
            
            if (activeBanners.length === 0) {
                if (bannerSection) bannerSection.style.display = 'none';
                if (parentHeroContainer) {
                    const bannerContainerWrapper = slider.closest('.w-full.relative.overflow-hidden');
                    if (bannerContainerWrapper) bannerContainerWrapper.style.display = 'none';
                }
                return;
            } else {
                if (bannerSection) bannerSection.style.display = 'block';
                const bannerContainerWrapper = slider.closest('.w-full.relative.overflow-hidden');
                if (bannerContainerWrapper) bannerContainerWrapper.style.display = 'block';
            }
            
            let slidesHtml = '';
            let dotsHtml = '';

            activeBanners.forEach((banner, idx) => {
                const imageUrl = banner.desktop_url || banner.image || "logo01.webp";
                const bannerTitle = banner.title || banner.name || 'Banner';
                
                slidesHtml += `
                    <div class="w-full h-full flex-shrink-0 relative">
                        <img src="${imageUrl}" alt="${bannerTitle}" class="w-full h-full object-cover">
                    </div>
                `;
                dotsHtml += `
                    <button onclick="currentSlide(${idx})" class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full ${idx === currentSlideIndex ? 'bg-white' : 'bg-white/40'} transition cursor-pointer"></button>
                `;
            });

            slider.innerHTML = slidesHtml;
            if (dotsContainer) dotsContainer.innerHTML = dotsHtml;
            
            if (slideInterval) clearInterval(slideInterval);
            if (activeBanners.length > 1) {
                slideInterval = setInterval(nextSlide, 5000);
            }
        }

        function updateSlider() {
            const slider = document.getElementById('bannerSlider');
            if (!slider || activeBanners.length === 0) return;

            slider.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            
            const dotsContainer = document.getElementById('sliderDots');
            if (dotsContainer) {
                const dots = dotsContainer.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].className = i === currentSlideIndex 
                        ? "w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-white transition cursor-pointer" 
                        : "w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-white/40 transition cursor-pointer";
                }
            }
        }

        function nextSlide() {
            if (activeBanners.length === 0) return;
            currentSlideIndex = (currentSlideIndex + 1) % activeBanners.length;
            updateSlider();
        }

        function prevSlide() {
            if (activeBanners.length === 0) return;
            currentSlideIndex = (currentSlideIndex - 1 + activeBanners.length) % activeBanners.length;
            updateSlider();
        }

        function currentSlide(index) {
            currentSlideIndex = index;
            updateSlider();
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 5000);
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`${API_BASE}/products`);
                if (!response.ok) throw new Error("Gagal mengambil produk");
                
                const data = await response.json();
                allProducts = Array.isArray(data) ? data : (data.products || data.data || []);
                renderProducts(allProducts);
            } catch (error) {
                console.error(error);
                const productCountEl = document.getElementById('productCount');
                const emptyStateEl = document.getElementById('emptyState');
                if (productCountEl) productCountEl.innerText = "Gagal memuat";
                if (emptyStateEl) emptyStateEl.classList.remove('hidden');
            }
        }

        function getOrGenerateSku(p, index) {
            if (p.sku && p.sku.trim() !== '') return p.sku;
            const prefix = (p.name || 'DRM').substring(0, 3).toUpperCase();
            const idNum = p.id ? String(p.id).padStart(3, '0') : String(index + 1).padStart(3, '0');
            return `SKU-${prefix}-${idNum}`;
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('productCount');
            
            if (!grid) return;

            grid.innerHTML = '';
            if (countBadge) countBadge.innerText = `${products.length} Produk`;

            if (products.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            } else {
                if (emptyState) emptyState.classList.add('hidden');
            }

            products.forEach((p, idx) => {
                let displayImage = 'logo01.webp';
                if (Array.isArray(p.images) && p.images.length > 0) {
                    displayImage = p.images[0];
                } else if (typeof p.images === 'string' && p.images.trim() !== '') {
                    try { const parsed = JSON.parse(p.images); if(parsed.length > 0) displayImage = parsed[0]; } catch(e) { displayImage = p.images.split(',')[0].trim(); }
                } else {
                    displayImage = p.image || p.image_url || 'logo01.webp';
                }

                const card = document.createElement('div');
                card.className = "group bg-white border border-gray-200/80 rounded-xl sm:rounded-2xl overflow-hidden cursor-pointer hover:shadow-lg transition duration-300 flex flex-col";
                card.onclick = () => openModal(p, idx);

                card.innerHTML = `
                    <div class="relative w-full h-44 sm:h-56 bg-gray-100 overflow-hidden">
                        <img src="${displayImage}" alt="${p.name || 'Sneakers'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    </div>
                    <div class="p-3 sm:p-4 flex flex-col flex-grow justify-center">
                        <h3 class="font-bold text-xs sm:text-sm text-gray-900 group-hover:text-gray-600 transition text-center truncate">${p.name || 'Sneakers'}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        const searchInputEl = document.getElementById('searchInput');
        if (searchInputEl) {
            searchInputEl.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase();
                const filtered = allProducts.filter(p => (p.name || '').toLowerCase().includes(keyword));
                renderProducts(filtered);
            });
        }

        function openModal(p, idx) {
            const rawPrice = parseFloat(p.price) || 0;
            const discount = parseFloat(p.discount) || 0;
            const finalPrice = discount > 0 ? rawPrice - (rawPrice * discount / 100) : rawPrice;
            
            if (Array.isArray(p.images) && p.images.length > 0) {
                currentImages = p.images;
            } else if (typeof p.images === 'string' && p.images.trim() !== '') {
                try { 
                    currentImages = JSON.parse(p.images); 
                    if(!Array.isArray(currentImages)) throw new Error();
                } catch(e) { 
                    currentImages = p.images.split(',').map(s => s.trim()).filter(Boolean); 
                }
            } else {
                currentImages = [p.image || p.image_url || 'logo01.webp'];
            }

            const productCondition = p.condition || 'New';
            const generatedSku = getOrGenerateSku(p, idx || 0);

            document.getElementById('modalImage').src = currentImages[0];
            document.getElementById('modalTitle').innerText = p.name || '-';
            document.getElementById('modalSku').innerText = `SKU: ${generatedSku}`;
            document.getElementById('modalPrice').innerText = `Rp ${finalPrice.toLocaleString('id-ID')}`;
            
            const oldPriceEl = document.getElementById('modalOldPrice');
            const discBadgeEl = document.getElementById('modalDiscountBadge');
            if (discount > 0) {
                oldPriceEl.innerText = `Rp ${rawPrice.toLocaleString('id-ID')}`;
                discBadgeEl.innerText = `Diskon ${discount}%`;
                discBadgeEl.classList.remove('hidden');
            } else {
                oldPriceEl.innerText = '';
                discBadgeEl.classList.add('hidden');
            }

            document.getElementById('modalDesc').innerText = p.description || 'Tidak ada deskripsi.';
            
            const galleryContainer = document.getElementById('modalGallery');
            galleryContainer.innerHTML = '';
            if (currentImages.length > 1) {
                galleryContainer.classList.remove('hidden');
                currentImages.forEach((imgUrl, i) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgUrl;
                    thumb.className = `w-14 h-14 object-cover rounded-lg cursor-pointer border-2 transition ${i === 0 ? 'border-emerald-600 opacity-100' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    thumb.onclick = () => {
                        document.getElementById('modalImage').src = imgUrl;
                        Array.from(galleryContainer.children).forEach(el => el.classList.remove('border-emerald-600', 'opacity-100'));
                        thumb.classList.add('border-emerald-600', 'opacity-100');
                    };
                    galleryContainer.appendChild(thumb);
                });
            } else {
                galleryContainer.classList.add('hidden');
            }

            const sizeContainer = document.getElementById('modalSizeContainer');
            sizeContainer.innerHTML = '';
            let sizes = [];
            if (Array.isArray(p.sizes)) {
                sizes = p.sizes;
            } else if (typeof p.size === 'string') {
                sizes = p.size.split(/[,/]/).map(s => s.trim()).filter(Boolean);
            } else if (p.size) {
                sizes = [String(p.size)];
            }

            selectedSize = sizes.length > 0 ? sizes[0] : '-';

            if (sizes.length > 0) {
                sizes.forEach((sz, i) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.innerText = sz;
                    btn.className = `px-3.5 py-1.5 text-xs font-bold rounded-xl border transition cursor-pointer ${i === 0 ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'}`;
                    btn.onclick = () => {
                        selectedSize = sz;
                        Array.from(sizeContainer.children).forEach(b => {
                            b.className = "px-3.5 py-1.5 text-xs font-bold rounded-xl border bg-white text-gray-800 border-gray-300 hover:border-gray-500 transition cursor-pointer";
                        });
                        btn.className = "px-3.5 py-1.5 text-xs font-bold rounded-xl border bg-gray-900 text-white border-gray-900 transition cursor-pointer";
                        updateWhatsAppLink(p, finalPrice, generatedSku);
                    };
                    sizeContainer.appendChild(btn);
                });
            } else {
                sizeContainer.innerHTML = '<span class="text-xs text-gray-500">Ukuran tidak tersedia</span>';
            }

            const condBadge = document.getElementById('modalCondition');
            condBadge.innerText = productCondition;
            condBadge.className = `absolute top-3 left-3 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider bg-gray-900 text-white shadow`;

            updateWhatsAppLink(p, finalPrice, generatedSku);

            const modal = document.getElementById('productModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modalContent').classList.remove('scale-95');
                document.getElementById('modalContent').classList.add('scale-100');
            }, 10);
        }

        function updateWhatsAppLink(p, finalPrice, generatedSku) {
            const waNumber = "6287783098165";
            const waType = (p.whatsappType || p.wa_type || 'pesan').toLowerCase();
            
            const waBtn = document.getElementById('modalWaBtn');
            const waBtnText = document.getElementById('modalWaBtnText');

            let message = "";

            if (waType.includes('tanya') || waType.includes('question')) {
                waBtnText.innerText = "Tanya Sekarang via WhatsApp";
                waBtn.className = "w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-sky-950/10 text-xs sm:text-sm";
                
                message = `Halo Diremar Casual, saya ingin bertanya mengenai produk ini:\n\n` +
                          `• Nama Produk: ${p.name || '-'}\n` +
                          `• SKU: ${generatedSku}\n` +
                          `• Kondisi: ${p.condition || 'New'}\n` +
                          `• Size: ${selectedSize}\n` +
                          `• Deskripsi: ${p.description || '-'}\n\n` +
                          `Mohon informasinya. Terima kasih!`;
            } else {
                waBtnText.innerText = "Pesan Sekarang via WhatsApp";
                waBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/10 text-xs sm:text-sm";
                
                message = `Halo Diremar Casual, saya ingin memesan produk ini:\n\n` +
                          `• Nama Produk: ${p.name || '-'}\n` +
                          `• SKU: ${generatedSku}\n` +
                          `• Harga: Rp ${finalPrice.toLocaleString('id-ID')}\n` +
                          `• Ukuran (Size): ${selectedSize}\n` +
                          `• Kondisi: ${p.condition || 'New'}\n\n` +
                          `Mohon infokan ketersediaannya. Terima kasih!`;
            }
            
            waBtn.href = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
        }

        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.classList.add('opacity-0');
            document.getElementById('modalContent').classList.remove('scale-100');
            document.getElementById('modalContent').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        const productModalEl = document.getElementById('productModal');
        if (productModalEl) {
            productModalEl.addEventListener('click', (e) => {
                if (e.target.id === 'productModal') closeModal();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchBanners();
            fetchProducts();
        });
    </script>
</body>
</html>
