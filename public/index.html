<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diremar Casual - Official Sneakers Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navbar (Tanpa Tombol Admin) -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-widest">DIREMAR CASUAL</h1>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-zinc-900 text-white py-16 px-4 text-center">
        <h2 class="text-3xl md:text-5xl font-black mb-4 tracking-tight">Langkah Stylish Setiap Hari</h2>
        <p class="text-gray-400 max-w-xl mx-auto text-sm md:text-base">Temukan koleksi sneakers casual terbaik, original, dan berkualitas tinggi hanya di Diremar Casual.</p>
    </section>

    <!-- Katalog Produk -->
    <main class="max-w-7xl mx-auto py-12 px-4">
        <h3 class="text-2xl font-bold mb-8 border-b pb-2">Katalog Sneakers</h3>
        
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-gray-500 col-span-full text-center py-10">Belum ada produk tersedia.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white text-center py-6 mt-16 text-sm text-gray-400">
        <p>&copy; 2026 Diremar Casual. All Rights Reserved.</p>
    </footer>

</body>
</html>
